name: Build and commit minified bundles

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build minified CSS and JS bundles
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p css js
          CSS_OUT="css/bundle.min.css"
          JS_OUT="js/bundle.min.js"
          TMPCSS="$(mktemp)"
          TMPJS="$(mktemp)"

          echo "Collecting CSS files (in order)..."
          css_files=(
            "css/bootstrap.css"
            "css/animate.css"
            "css/flexslider.css"
            "fonts/flaticon/font/flaticon.css"
            "css/owl.carousel.min.css"
            "css/owl.theme.default.min.css"
            "css/icomoon.css"
            "css/style.css"
          )
          for f in "${css_files[@]}"; do
            if [ -f "$f" ]; then
              echo " - adding $f"
              cat "$f" >> "$TMPCSS"
              echo "" >> "$TMPCSS"
            else
              echo " - skipping (not found): $f"
            fi
          done

          echo "Minifying CSS to $CSS_OUT ..."
          # Use npx csso to minify (npx will fetch csso if necessary)
          npx csso "$TMPCSS" --output "$CSS_OUT" || (echo "csso failed, writing concatenated CSS instead" && cp "$TMPCSS" "$CSS_OUT")

          echo "Collecting JS files (in order)..."
          js_files=(
            "js/jquery.min.js"
            "js/jquery.easing.1.3.js"
            "js/bootstrap.min.js"
            "js/jquery.waypoints.min.js"
            "js/jquery.flexslider-min.js"
            "js/owl.carousel.min.js"
            "js/jquery.countTo.js"
            "js/main.js"
          )
          for f in "${js_files[@]}"; do
            if [ -f "$f" ]; then
              echo " - adding $f"
              cat "$f" >> "$TMPJS"
              # ensure a statement separator
              echo ";" >> "$TMPJS"
            else
              echo " - skipping (not found): $f"
            fi
          done

          echo "Minifying JS to $JS_OUT ..."
          # Use npx terser to minify
          npx terser "$TMPJS" -c -m -o "$JS_OUT" || (echo "terser failed, writing concatenated JS instead" && cp "$TMPJS" "$JS_OUT")

          # Clean up
          rm -f "$TMPCSS" "$TMPJS"

      - name: Create branch and commit bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="opt/minify-inline-assets"

          # Create branch if doesn't exist, otherwise switch/create based on remote
          if git show-ref --verify --quiet "refs/heads/${branch}"; then
            git checkout "${branch}"
          else
            git checkout -b "${branch}"
          fi

          git add css/bundle.min.css js/bundle.min.js || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add minified CSS/JS bundles (generated by workflow)"
            git push -u origin "${branch}"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add minified CSS/JS bundles (generated by workflow)"
          branch: opt/minify-inline-assets
          title: "Opt: add minified CSS/JS bundles"
          body: |
            This PR was automatically created by the CI workflow. It adds:
              - css/bundle.min.css (concatenated & minified)
              - js/bundle.min.js (concatenated & minified)

            Next recommended step (manual or automated):
              - update index.html to inline critical CSS and preload css/bundle.min.css, and replace multiple script tags with a single deferred bundle load (js/bundle.min.js).
          labels: automation
          base: main
